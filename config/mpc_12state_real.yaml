# MPC 12-state — REAL vehicle (2.5 kg, 4 x AIR2216II-KV920 + T1045II, 4S/16V)
#
# Envelope basis (docs/PERFORMANCE_ENVELOPE.md), from manufacturer bench data:
#   thrust/motor @100% = 1332 g  ->  T_max = 52.2 N
#   weight = 24.5 N  ->  TWR 2.13, max tilt 62 deg
#   a_h_safe(eta=0.7) = 10.86 m/s^2   max climb accel = T/m - g = 11.09 m/s^2
#   hover ~60% throttle (628 g/motor), ~22.4 A, ~360 W
#
# Do NOT use these limits in SITL: the x500_d435 model is 2.0 kg with 27.5 N
# (TWR 1.40) and is substantially less capable. Use mpc_12state.yaml there.

mpc_12state_node:
  ros__parameters:
    debug: False
    pub_pose_path: True

    # Must match the guidance/predictor sampling time.
    dt_pred: 0.1
    mpc_window: 10

    # Solve rate is owned by this node, decoupled from the reference publisher.
    mpc_rate: 20.0
    ref_timeout: 0.5
    odom_timeout: 0.3
    max_consecutive_failures: 5

    # mavros local_position/odom twist is in the BODY frame.
    odom_twist_in_body_frame: True

    # Publish a NEAR horizon sample as the controller setpoint, never the
    # horizon end (a far "carrot" the geometric controller tracks poorly).
    cmd_sample_index: 2

    minimum_altitude: 3.0
    reference_frame_id: "interceptor/odom"

    # --- dynamic limits, derived from the envelope above -------------------
    xy_max_velocity: 18.0      # m/s   (measure drag-limited top speed to refine)
    z_max_velocity: 6.0        # m/s
    yaw_max_velocity: 3.0      # rad/s

    xy_max_acceleration: 10.0  # m/s^2 (a_h_safe at eta=0.7 = 10.86)
    z_max_acceleration: 6.0    # m/s^2 (of 11.09 available)
    yaw_max_acceleration: 10.0 # rad/s/s

    # Keep jerk inside the attitude-loop bandwidth (attctrl_tau 0.3 s).
    xy_max_jerk: 40.0
    z_max_jerk: 30.0
    yaw_max_jerk: 10.0

    # Objective weights
    xy_state_weight: 5000.0
    z_state_weight: 7000.0
    yaw_state_weight: 1000.0

    xy_input_weight: 200.0
    z_input_weight: 200.0
    yaw_input_weight: 100.0

    enable_control_smoothing: False
    xy_smooth_input_weight: 100.0
    z_smooth_input_weight: 100.0
    yaw_smooth_input_weight: 100.0
